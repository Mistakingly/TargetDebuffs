name: Build and release

on:
  # Runs automatically whenever you publish a release on GitHub
  release:
    types: [published]
  # Lets you run it by hand from the Actions tab for an existing release
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. 1.0.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dest = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath $dest -Force
          Add-Content $env:GITHUB_ENV "DALAMUD_HOME=$dest"

      - name: Build
        shell: pwsh
        run: dotnet build TargetDebuffs.csproj -c Release -p:Version=$env:TAG -p:AssemblyVersion=$env:TAG -p:FileVersion=$env:TAG

      - name: Attach zip to the release
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path bin -Recurse -Filter latest.zip | Select-Object -First 1
          if (-not $zip) { throw "latest.zip not found - is DalamudPackager set up in the project?" }
          Copy-Item $zip.FullName TargetDebuffs.zip
          gh release upload $env:TAG TargetDebuffs.zip --clobber

      - name: Update repo.json on main
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/TargetDebuffs.zip"
          $plugins = @(Get-Content repo.json -Raw | ConvertFrom-Json)
          foreach ($p in $plugins) {
            $p.AssemblyVersion = $env:TAG
            $p.TestingAssemblyVersion = $env:TAG
            $p.DownloadLinkInstall = $url
            $p.DownloadLinkTesting = $url
            $p.DownloadLinkUpdate = $url
            $p.LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          }
          ConvertTo-Json -InputObject $plugins -Depth 10 | Set-Content repo.json -Encoding utf8NoBOM
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update repo.json for $env:TAG"
            git push origin main
          }
